name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LUAU_LSP_VERSION: "1.70.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Build place
        run: rojo build default.project.json -o WeaponSystem.rbxl

      - name: Type check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          curl -sSfL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau"
          luau-lsp analyze --platform roblox --sourcemap sourcemap.json --definitions "@roblox=globalTypes.d.luau" src

      - name: Unit tests
        run: lune run tests/run.luau
